<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="高中物理互動模擬實驗室：以可操作的動畫探索物理概念。">
<title>Physics Lab｜互動物理實驗室</title>
<style>
:root{color-scheme:light;--ink:#12223d;--sub:#586a82;--blue:#235de5;--border:#e3e9f3;--bg:#f5f8fc;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.bar{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}.logo{background:#eaf0ff;color:#275ee9;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;font-size:25px}.brand b{font-size:18px}.brand small{display:block;color:var(--sub);font-size:11px}.nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:0;border-radius:9px;padding:10px 12px;background:none;color:#43516a;white-space:nowrap;font-size:14px}.nav button:hover,.nav button.active{background:#eaf0ff;color:#1d54d7}.wrap{max-width:1200px;margin:auto;padding:0 20px}.hero{background:linear-gradient(112deg,#e9f1ff 0%,#f5faff 60%,#d6e8fa 100%);border-bottom:1px solid #e3ebf7}.hero-inner{max-width:1200px;min-height:290px;margin:auto;padding:52px 20px;display:flex;align-items:center;justify-content:space-between;gap:30px}.hero h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.05em;margin:4px 0 7px}.hero h1 span{color:var(--blue)}.hero h2{font-size:24px;margin:0 0 13px}.hero p{color:var(--sub);line-height:1.7;margin:0}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.chip{background:#ffffffbd;border:1px solid #dde8f8;padding:8px 12px;border-radius:99px;font-size:13px}.hero-art{width:230px;height:170px;flex-shrink:0}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 17px}.heading h2{margin:0;font-size:22px}.heading p{margin:5px 0 0;color:var(--sub);font-size:13px}.search{background:white;border:1px solid var(--border);border-radius:10px;padding:11px 13px;min-width:225px;width:270px;max-width:100%}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 5px 16px #21335308;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #21335318}.card-top{height:96px;display:grid;place-items:center;font-size:46px;background:var(--tint)}.card-body{padding:17px;flex:1;display:flex;flex-direction:column}.card-body h3{font-size:18px;margin:0 0 7px}.card-body p{font-size:12.5px;line-height:1.6;color:var(--sub);margin:0;flex:1}.card button{border:0;background:var(--light);color:var(--accent);padding:9px 14px;border-radius:10px;font-weight:700;margin-top:17px;text-align:center}.section{padding-bottom:45px}.sim-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sim{border:1px solid var(--border);background:white;border-radius:16px;padding:18px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;color:inherit;position:relative;transition:transform .18s,box-shadow .18s,border-color .18s;background-image:linear-gradient(110deg,var(--sim-tint,#f7faff),transparent 42%)}.sim:hover{transform:translateY(-3px);box-shadow:0 14px 26px #2036551b;border-color:var(--sim-accent,#5d82d6)}.sim:focus-visible{outline:3px solid var(--sim-accent,#5d82d6);outline-offset:3px}.sim:active{transform:translateY(-1px)}.sim .symbol{background:var(--sim-tint,#eaf0ff);color:var(--sim-accent,#346bea);border:1px solid color-mix(in srgb,var(--sim-accent,#346bea) 18%,white);border-radius:15px;width:78px;height:78px;display:grid;place-items:center;flex-shrink:0;overflow:hidden}.sim .symbol svg{width:66px;height:66px;display:block}.sim .symbol .fallback-icon{font-size:24px;font-weight:800;letter-spacing:-.04em}.sim h3{font-size:16px;margin:0 0 5px}.sim p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.5}.tag{font-size:11px;color:#14745a;background:#e1f8ef;border-radius:99px;padding:4px 9px;display:inline-block}.soon{background:#f1f3f7;color:#657184}.sim .open-hint{display:inline-block;margin-top:12px;font-size:13px;color:var(--sim-accent,var(--blue));font-weight:700}.sim:hover .open-hint{text-decoration:underline}.sim>div:last-child{min-width:0;flex:1}@media(max-width:600px){.sim .symbol{width:68px;height:68px}.sim .symbol svg{width:60px;height:60px}}.empty{grid-column:1/-1;padding:25px;color:var(--sub);background:white;border:1px dashed var(--border);border-radius:12px}footer{border-top:1px solid var(--border);padding:23px 0;color:var(--sub);font-size:12px;background:#fff}footer .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #82adfa;outline-offset:3px}@media(max-width:940px){.cards{grid-template-columns:repeat(2,1fr)}.sim-grid{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap;gap:10px}.nav{width:100%}.hero-art{width:170px}}@media(max-width:600px){.cards,.sim-grid{grid-template-columns:1fr}.hero-inner{padding:37px 20px;min-height:auto}.hero-art{display:none}.heading{align-items:stretch;flex-direction:column}.search{width:100%}.card-top{height:75px}.card{flex-direction:row}.card-top{width:95px;height:auto;flex-shrink:0;font-size:36px}.card-body{padding:13px}.card button{margin-top:10px}}
</style>
</head><body>
<header><div class="bar"><a class="brand" href="#home"><span class="logo">⚛</span><span><b>Physics Lab</b><small>互動物理實驗室</small></span></a><nav class="nav" aria-label="物理主題導覽" id="nav"></nav></div></header>
<section class="hero" id="home"><div class="hero-inner"><div><h1>Physics <span>Lab</span></h1><h2>互動物理實驗室</h2><p>用看得見、能操作的動畫，探索物理世界。<br>調整參數、觀察現象、理解原理。</p><div class="chips"><span class="chip">▶ 即時互動</span><span class="chip">⚙ 自由調整參數</span><span class="chip">◉ 課堂與自主學習</span></div></div><svg class="hero-art" viewBox="0 0 240 170" aria-hidden="true"><path d="M22 35h197M40 35l20 74m25-74l20 74m25-74l20 74m25-74l20 74" stroke="#91a9cb" stroke-width="2"/><g fill="#3677da" stroke="#d9ecff" stroke-width="3"><circle cx="60" cy="113" r="19"/><circle cx="105" cy="113" r="19"/><circle cx="150" cy="113" r="19"/><circle cx="195" cy="113" r="19"/></g><path d="M151 34l52-41" stroke="#91a9cb" stroke-width="2"/><circle cx="217" cy="-14" r="19" fill="#3677da" stroke="#d9ecff" stroke-width="3"/></svg></div></section>
<main class="wrap"><div class="heading" id="topics"><div><h2>探索物理主題</h2><p>依單元分類，快速找到適合課堂的模擬動畫</p></div></div><div class="cards" id="cards"></div><section class="section" id="simulations"><div class="heading"><div><h2 id="list-title">互動模擬動畫</h2><p>逐步增加教材，所有動畫均可使用瀏覽器操作</p></div><input class="search" type="search" id="search" placeholder="搜尋動畫，例如：駐波" aria-label="搜尋動畫"></div><div class="sim-grid" id="sim-list"></div></section></main>
<footer><div class="wrap"><span><b>Physics Lab</b>　互動物理實驗室</span><span>為物理教學與自主探索而設計 · GitHub Pages</span></div></footer>
<script>
const topics=[{id:'all',name:'全部',emoji:'⌂'},{id:'mechanics',name:'力學',emoji:'🏃',description:'運動、力、動量、能量、圓周運動',tint:'#eaf3ff',light:'#e3efff',accent:'#1f61d0'},{id:'thermal',name:'熱學',emoji:'🌡️',description:'溫度、熱量、熱傳、氣體定律',tint:'#fff0e9',light:'#ffe8e2',accent:'#b84d35'},{id:'waves',name:'波動',emoji:'🌊',description:'行進波、駐波、干涉、繞射',tint:'#e6f8f6',light:'#daf4ef',accent:'#078477'},{id:'electromagnetism',name:'電磁學',emoji:'🧲',description:'電場、磁場、電路、電磁感應',tint:'#fff5e3',light:'#fff0d1',accent:'#a66b09'},{id:'optics',name:'光學',emoji:'🌈',description:'反射、折射、透鏡、光的干涉',tint:'#f1eafb',light:'#eadefb',accent:'#7b46bf'},{id:'modern',name:'近代物理',emoji:'⚛️',description:'原子模型、量子、核物理',tint:'#e9f3ff',light:'#deecff',accent:'#275dc0'},{id:'experiments',name:'實驗與數據',emoji:'📊',description:'測量、圖表、數據分析',tint:'#e8f7e9',light:'#dff2e1',accent:'#2e8547'}];
// 動畫由 manifest 自動產生的 simulations.json 載入；新增動畫不修改首頁。
let simulations=[],catalogState='loading';
const nav=document.getElementById('nav'),cards=document.getElementById('cards'),list=document.getElementById('sim-list'),search=document.getElementById('search');let selected='all';
nav.innerHTML=topics.map(x=>`<button data-topic="${x.id}" class="${x.id==='all'?'active':''}">${x.emoji} ${x.id==='all'?'首頁':x.name}</button>`).join('');
cards.innerHTML=topics.filter(x=>x.id!=='all').map(x=>`<article class="card" style="--tint:${x.tint};--light:${x.light};--accent:${x.accent}"><div class="card-top" aria-hidden="true">${x.emoji}</div><div class="card-body"><h3>${x.name}</h3><p>${x.description}</p><button type="button" data-topic="${x.id}">探索主題 →</button></div></article>`).join('');
// 動畫獨立識別圖像：只依通過目錄驗證的 path 對應圖案，無須改 manifest schema。
// 所有 SVG 都是每個物理現象專屬的簡潔線條，而非沿用分類的海浪 emoji。
function simulationIcon(path,title){
  const slug=path.split('/')[2];
  const icons={
    'diffraction-interference':{accent:'#087f9b',tint:'#e4f7fb',svg:`<svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M29 8V29M29 43V64" stroke="#145f7e" stroke-width="5"/><path d="M8 18H20M8 30H20M8 42H20M8 54H20" stroke="#16b4cf" stroke-width="3"/><path d="M33 36C46 36 55 29 61 18M33 36C48 36 57 36 66 36M33 36C46 36 55 43 61 54" stroke="#00859e" stroke-width="3"/><circle cx="29" cy="36" r="4" fill="#ffba65"/></svg>`},
    'huygens-principle':{accent:'#6c51bf',tint:'#f0ebff',svg:`<svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 9V63" stroke="#7d62cd" stroke-width="4"/><path d="M16 24A12 12 0 0 1 28 36M16 13A23 23 0 0 1 39 36M16 48A12 12 0 0 0 28 36M16 59A23 23 0 0 0 39 36" stroke="#9e83e5" stroke-width="2.6"/><path d="M51 10V62" stroke="#df954d" stroke-width="4" stroke-dasharray="8 5"/><circle cx="16" cy="36" r="4.5" fill="#ffb566"/></svg>`},
    'ripple-wave-superposition':{accent:'#ab567e',tint:'#fff0f5',svg:`<svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 13h58v46H7z" rx="5" fill="#fff6fa" stroke="#ab567e" stroke-width="2"/><path d="M9 37q8-22 17 0t18 0t18 0" stroke="#1ea9a0" stroke-width="3" fill="none"/><path d="M9 37q8 22 17 0t18 0t18 0" stroke="#a071e0" stroke-width="3" fill="none"/><path d="M9 37h55" stroke="#dc9849" stroke-width="2.5" stroke-dasharray="3 3"/><path d="M36 13v46" stroke="#b64f8e" stroke-width="1.6" stroke-dasharray="3 3"/></svg>`},
    'ripple-tank-lab':{accent:'#1764c7',tint:'#e6efff',svg:`<svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="7" y="10" width="58" height="52" rx="8" stroke="#1764c7" stroke-width="2.8"/><path d="M15 22c7-5 14-5 21 0s14 5 21 0M15 33c7-5 14-5 21 0s14 5 21 0M15 44c7-5 14-5 21 0s14 5 21 0M15 55c7-5 14-5 21 0s14 5 21 0" stroke="#64a3ed" stroke-width="2.7" stroke-linecap="round"/><circle cx="25" cy="28" r="5" fill="#e69c5f" stroke="#fff" stroke-width="1.5"/><circle cx="48" cy="40" r="4" fill="#1764c7" stroke="#fff" stroke-width="1.5"/></svg>`},
    'standing-wave':{accent:'#a15c20',tint:'#fff1dd',svg:`<svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 36H65" stroke="#bdc2cf" stroke-width="2" stroke-dasharray="3 5"/><path d="M7 36Q17 9 27 36T47 36T67 36" stroke="#ec9730" stroke-width="4"/><path d="M7 36Q17 63 27 36T47 36T67 36" stroke="#8668d2" stroke-width="3.5"/><circle cx="7" cy="36" r="3.5" fill="#9b6b3b"/><circle cx="27" cy="36" r="3.5" fill="#9b6b3b"/><circle cx="47" cy="36" r="3.5" fill="#9b6b3b"/></svg>`},
    'wave-superposition':{accent:'#b3547e',tint:'#ffebf3',svg:`<svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 27Q19 5 31 27T55 27T67 27" stroke="#14ac98" stroke-width="3" stroke-linecap="round"/><path d="M7 47Q19 69 31 47T55 47T67 47" stroke="#8d71e2" stroke-width="3" stroke-linecap="round"/><path d="M7 36Q19 36 31 36T55 36T67 36" stroke="#ea9a40" stroke-width="3" stroke-dasharray="4 4"/><path d="M36 12v48" stroke="#bd5b84" stroke-width="2" stroke-dasharray="3 3"/><path d="M31 32l5 5 5-5M31 42l5-5 5 5" stroke="#bd5b84" stroke-width="2" stroke-linecap="round"/></svg>`}
  };
  if(Object.prototype.hasOwnProperty.call(icons,slug))return icons[slug];
  // 對未來新動畫：以 slug 穩定散列配色、採專屬首字圖示，避免全部退回同一分類符號。
  let hash=0;for(const ch of slug)hash=(hash*33+ch.charCodeAt(0))>>>0;
  const palette=[['#245dc7','#e8efff'],['#008477','#e2f6f1'],['#8050bb','#f1e8fc'],['#b25d24','#fff0df'],['#ae476b','#ffedf4']];
  const [accent,tint]=palette[hash%palette.length];
  return{accent,tint,initial:((title||slug).trim()[0]||'物')};
}
function render(){
  nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.topic===selected);b.setAttribute('aria-pressed',String(b.dataset.topic===selected));});
  const query=search.value.trim().toLocaleLowerCase();
  const filtered=simulations.filter(x=>(selected==='all'||selected===x.category)&&(!query||(x.title+' '+x.description+' '+x.keywords.join(' ')+' '+topics.find(t=>t.id===x.category)?.name).toLocaleLowerCase().includes(query)));
  document.getElementById('list-title').textContent=(topics.find(x=>x.id===selected)?.name||'全部')+' · 互動模擬動畫';
  list.replaceChildren();
  if(catalogState!=='ready'||!filtered.length){
    const empty=document.createElement('div');empty.className='empty';empty.setAttribute('role','status');
    empty.textContent=catalogState==='loading'?'動畫目錄載入中…':catalogState==='error'?'動畫目錄無法載入，請稍後重新整理。':query?'目前沒有符合條件的動畫。可以切換其他主題或清除搜尋。':'此主題目前尚無已上架動畫，敬請期待。';
    list.append(empty);return;
  }
  filtered.forEach(x=>{
    // 整張動畫卡片使用原生連結：可點擊、Tab 聚焦、Enter 開啟及在新分頁開啟。
    const article=document.createElement('a');article.className='sim';article.href=x.path;
    article.setAttribute('aria-label','開啟模擬器：'+x.title);
    const icon=simulationIcon(x.path,x.title);
    article.style.setProperty('--sim-accent',icon.accent);article.style.setProperty('--sim-tint',icon.tint);
    const symbol=document.createElement('div');symbol.className='symbol';symbol.setAttribute('aria-hidden','true');
    if(icon.svg){symbol.innerHTML=icon.svg;}else{
      const letter=document.createElement('span');letter.className='fallback-icon';letter.textContent=icon.initial;symbol.append(letter);
    }
    const body=document.createElement('div'),h=document.createElement('h3'),p=document.createElement('p'),tag=document.createElement('span'),hint=document.createElement('span'),linkBox=document.createElement('div');
    h.textContent=x.title;p.textContent=x.description;tag.className='tag';tag.textContent='可使用';
    hint.className='open-hint';hint.textContent='開啟模擬器 ↗';
    linkBox.append(hint);body.append(h,p,tag,linkBox);article.append(symbol,body);list.append(article);
  });
}
async function loadCatalog(){
  try{
    const response=await fetch('./simulations.json',{cache:'no-store'});
    if(!response.ok)throw Error('Catalog unavailable');
    const data=await response.json();
    if(!Array.isArray(data)||!data.every(x=>x&&typeof x.title==='string'&&typeof x.description==='string'&&topics.some(t=>t.id!=='all'&&t.id===x.category)&&Array.isArray(x.keywords)&&x.keywords.every(k=>typeof k==='string')&&typeof x.path==='string'&&new RegExp('^simulations/'+x.category+'/[a-z0-9]+(?:-[a-z0-9]+)*/$').test(x.path)))throw Error('Invalid catalog');
    simulations=data;catalogState='ready';
  }catch(error){catalogState='error';}
  render();
}
function choose(id){selected=id;render();document.getElementById('simulations').scrollIntoView({behavior:'smooth',block:'start'});}
nav.addEventListener('click',ev=>{const b=ev.target.closest('[data-topic]');if(b)choose(b.dataset.topic)});cards.addEventListener('click',ev=>{const b=ev.target.closest('[data-topic]');if(b)choose(b.dataset.topic)});search.addEventListener('input',render);render();loadCatalog();
</script></body></html>
