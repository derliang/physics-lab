<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Physics Lab｜互動物理實驗室</title><meta name="theme-color" content="#fff"><meta name="description" content="Physics Lab 高中物理互動教學模擬平台">
<style>
:root{--ink:#0a1c3e;--muted:#516580;--line:#e2e8f2;--blue:#1555dc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fbfcff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:#ffffffef;backdrop-filter:blur(15px);box-shadow:0 2px 14px #22375a14}.bar{max-width:1520px;padding:8px 24px;margin:auto;min-height:78px;display:flex;gap:24px;align-items:center}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand .logo{font-size:38px;color:#175ce9}.brand b{font-size:25px;display:block}.brand small{font-size:12px;color:var(--muted);display:block}nav{display:flex;align-items:center;gap:2px;margin-left:auto;overflow:auto;scrollbar-width:none}nav button{white-space:nowrap;background:transparent;border:0;border-bottom:3px solid transparent;padding:16px 12px;color:#152d51;font-weight:700;font-size:14px}nav button[aria-pressed=true]{border-bottom-color:#185bed;color:#185bed}nav button:hover{background:#eff5ff}.hero{background:linear-gradient(110deg,#e4f1ff 0%,#d5e8f8 53%,#c1d2e0 100%);overflow:hidden;isolation:isolate;position:relative}.hero:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(circle at 76% 65%,#ffe7be 0%,transparent 39%),linear-gradient(0deg,#adc9dd80,transparent 45%)}.hero-inner{max-width:1520px;min-height:296px;margin:auto;padding:32px 6%;display:flex;justify-content:space-between;align-items:center;gap:16px}.hero h1{font-size:clamp(43px,6vw,78px);letter-spacing:-2px;line-height:1;margin:0}.hero h1 span{color:#1755dd}.hero h2{font-size:clamp(24px,3vw,36px);margin:8px 0}.hero p{font-size:clamp(15px,1.8vw,21px);color:#465c79;margin:0 0 19px}.chips{display:flex;flex-wrap:wrap;gap:10px}.chips span{padding:9px 16px;border-radius:22px;background:#ffffffc5;color:#175bd6;font-size:13px;font-weight:700}.hero svg{width:43%;max-width:515px;max-height:260px;filter:drop-shadow(0 16px 11px #123b5935);flex:none}main{max-width:1520px;margin:auto;padding:23px 25px 45px}.topline{display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:0 0 15px}.topline h2{margin:0;font-size:23px}.search{border:1px solid #cbd6e6;border-radius:11px;padding:11px 14px;background:white;min-width:min(300px,100%)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{background:linear-gradient(145deg,#fff,var(--tint));overflow:hidden;border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px #21395f15;min-width:0}.art{height:119px;display:grid;place-items:center;background:linear-gradient(120deg,var(--dark),var(--light));position:relative;overflow:hidden}.art:after{content:"";position:absolute;border:1px solid #fff8;width:270px;height:135px;transform:rotate(-18deg);border-radius:50%}.art span{font-size:72px;filter:drop-shadow(1px 8px 8px #14244155)}.info{padding:12px 18px 18px}.info h3{margin:0 0 8px;font-size:20px}.info p{font-size:13px;color:var(--muted);line-height:1.5;margin:0;min-height:39px}.info button{display:block;padding:9px 22px;margin:12px auto 0;border:0;border-radius:23px;font-size:13px;font-weight:700;color:var(--accent);background:var(--tint)}.card:hover{transform:translateY(-2px);transition:transform .18s}#library{scroll-margin-top:98px;margin-top:32px}.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.entry{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;min-height:140px}.entry h3{margin:7px 0}.entry p{margin:0;color:var(--muted);font-size:13px}.tag{display:inline-block;border-radius:15px;padding:5px 10px;font-size:11px;color:#285bb5;background:#edf3ff;font-weight:700}.entry a{display:inline-block;margin-top:14px;color:#155adb;font-weight:700}.empty{grid-column:1/-1;text-align:center;padding:29px;color:var(--muted);border:1px dashed #c4d1e2;border-radius:14px}footer{border-top:1px solid var(--line);background:white;padding:18px 26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;color:#536680;font-size:13px}footer b{color:var(--ink)}footer a{text-decoration:underline}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #2f6aff;outline-offset:3px}@media(max-width:1100px){.bar{gap:10px;padding:8px 13px}.brand b{font-size:20px}.brand .logo{font-size:30px}nav button{padding:13px 8px}.cards{gap:10px}.art{height:86px}.art span{font-size:53px}.info{padding:10px}.info h3{font-size:17px}.info p{min-height:0}.hero-inner{min-height:220px;padding:22px 32px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.bar{flex-wrap:wrap}.brand{width:100%}nav{width:100%;margin:0}.hero-inner{min-height:210px;padding:22px}.hero svg{width:32%}.chips{gap:5px}.chips span{padding:6px;font-size:10px}main{padding:18px 13px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.list{grid-template-columns:1fr}.search{width:100%}}@media(max-height:850px) and (orientation:landscape){.hero-inner{min-height:190px;padding-top:15px;padding-bottom:15px}.hero svg{max-height:178px}.art{height:84px}.info button{margin-top:7px;padding:7px 17px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head>
<body><header><div class="bar"><a href="./" class="brand"><span class="logo">⚛</span><span><b>Physics Lab</b><small>互動物理實驗室</small></span></a><nav id="nav" aria-label="主題導覽列"></nav></div></header>
<section class="hero"><div class="hero-inner"><div><h1>Physics <span>Lab</span></h1><h2>互動物理實驗室</h2><p>用可操作的動畫，探索物理的世界</p><div class="chips"><span>▶ 互動模擬</span><span>⚙ 自由調整參數</span><span>▥ 可視化物理概念</span></div></div>
<svg viewBox="0 0 460 240" role="img" aria-label="牛頓擺"><defs><radialGradient id="metal"><stop stop-color="#fff"/><stop offset=".28" stop-color="#bfd0df"/><stop offset=".75" stop-color="#516d88"/><stop offset="1" stop-color="#17304c"/></radialGradient></defs><path d="M20 16H435" stroke="#29455e" stroke-width="10" stroke-linecap="round"/><g stroke="#8296a9" stroke-width="2.8"><path d="M102 22L46 177"/><path d="M165 22L165 177"/><path d="M222 22L222 177"/><path d="M279 22L279 177"/><path d="M336 22L336 177"/></g><g fill="url(#metal)"><circle cx="46" cy="192" r="28"/><circle cx="165" cy="192" r="28"/><circle cx="222" cy="192" r="28"/><circle cx="279" cy="192" r="28"/><circle cx="336" cy="192" r="28"/></g></svg></div></section>
<main><section><div class="topline"><h2>探索物理主題</h2><input class="search" id="search" type="search" placeholder="搜尋動畫、單元或概念…" aria-label="搜尋動畫"></div><div class="cards" id="categories"></div></section><section id="library"><div class="topline"><h2 id="library-title">互動動畫</h2><span id="counter" style="color:#516580"></span></div><div class="list" id="entries"></div></section></main><footer><span><b>Physics Lab</b> 互動物理實驗室　｜　用動畫讓物理更直觀、更好理解</span><span><a href="https://github.com/derliang/physics-lab">View on GitHub</a>　｜　教學用途・免費使用</span></footer>
<script>
const topics=[["mechanics","力學","🏃","運動、力、能量、動量、圓周運動等","#e2efff","#125de6","#2873b5","#82c2ed"],["thermal","熱學","🌡️","溫度、熱量、熱傳、氣體定律等","#ffe8e4","#cb3129","#893527","#e49b88"],["waves","波動","🌊","行進波、駐波、干涉、繞射等","#e2f7f5","#0a898e","#087f97","#85ded8"],["electromagnetism","電磁學","🧲","電場、磁場、電路、電磁感應等","#fff1d9","#be720d","#996020","#ecc78d"],["optics","光學","🌈","反射、折射、干涉、繞射、光譜等","#f0e8ff","#8248d9","#37268c","#9a82df"],["modern","近代物理","⚛️","原子模型、量子、核物理、相對論等","#e2efff","#155ed8","#1c4b9f","#8bbaf5"],["experiments","實驗與數據","📊","實驗模擬、測量、數據與圖表等","#e4f5e7","#15813b","#276c44","#a4d7aa"],["about","關於本站","📚","網站介紹、使用說明與更新紀錄","#edf0f4","#43566e","#3c4a62","#99a4b7"]];
const nav=document.querySelector("#nav"),cards=document.querySelector("#categories"),entries=document.querySelector("#entries"),title=document.querySelector("#library-title"),counter=document.querySelector("#counter"),search=document.querySelector("#search");let selected="all",catalog=[];
function btn(txt,key){const el=document.createElement("button");el.textContent=txt;el.setAttribute("aria-pressed",String(selected===key));el.onclick=()=>select(key);return el}
function select(key){selected=key;renderNav();renderList();if(key!=="all")document.querySelector("#library").scrollIntoView({behavior:"smooth",block:"start"});else window.scrollTo({top:0,behavior:"smooth"})}
function renderNav(){nav.replaceChildren(btn("⌂ 首頁","all"));topics.forEach(s=>nav.append(btn(s[1],s[0])))}
topics.forEach(s=>{const node=document.createElement("article");node.className="card";node.style.setProperty("--tint",s[4]);node.style.setProperty("--accent",s[5]);node.style.setProperty("--dark",s[6]);node.style.setProperty("--light",s[7]);const art=document.createElement("div");art.className="art";const pic=document.createElement("span");pic.textContent=s[2];art.append(pic);const info=document.createElement("div");info.className="info";const h=document.createElement("h3");h.textContent=s[1]+" →";const p=document.createElement("p");p.textContent=s[3];const b=btn(s[0]==="about"?"查看更多 ›":"進入主題 ›",s[0]);info.append(h,p,b);node.append(art,info);cards.append(node)});
search.addEventListener("input",renderList);
function renderList(){let q=search.value.toLocaleLowerCase().trim();let all=catalog.filter(x=>(selected==="all"||x.category===selected)&&(String(x.title+" "+x.description+" "+(x.keywords||[]).join(" ")).toLocaleLowerCase().includes(q)));title.textContent=selected==="all"?"互動動畫":(topics.find(s=>s[0]===selected)?.[1]||"互動動畫")+"｜動畫清單";counter.textContent=all.length+" 個動畫";entries.replaceChildren();if(!all.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=q?"找不到符合條件的動畫。":"此主題目前準備上架中，敬請期待。";entries.append(empty);return}all.forEach(x=>{const card=document.createElement("article");card.className="entry";const tag=document.createElement("span");tag.className="tag";tag.textContent=topics.find(s=>s[0]===x.category)?.[1]||x.category;const h=document.createElement("h3");h.textContent=x.title;const p=document.createElement("p");p.textContent=x.description;const a=document.createElement("a");a.href=x.path;a.textContent="開啟模擬器 →";card.append(tag,h,p,a);entries.append(card)})}
fetch("./simulations.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("catalog unavailable");return r.json()}).then(data=>{catalog=Array.isArray(data)?data:[];renderList()}).catch(()=>{entries.textContent="動畫目錄讀取中；如果仍無法使用，請稍後重新整理。"});renderNav();renderList();
</script></body></html>
