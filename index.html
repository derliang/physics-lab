<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="高中物理互動模擬實驗室：以可操作的動畫探索物理概念。">
<title>Physics Lab｜互動物理實驗室</title>
<style>
:root{color-scheme:light;--ink:#12223d;--sub:#586a82;--blue:#235de5;--border:#e3e9f3;--bg:#f5f8fc;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,'Noto Sans TC','Microsoft JhengHei',sans-serif;color:var(--ink);background:var(--bg)}a{text-decoration:none;color:inherit}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}.bar{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:24px}.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}.logo{background:#eaf0ff;color:#275ee9;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;font-size:25px}.brand b{font-size:18px}.brand small{display:block;color:var(--sub);font-size:11px}.nav{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{border:0;border-radius:9px;padding:10px 12px;background:none;color:#43516a;white-space:nowrap;font-size:14px}.nav button:hover,.nav button.active{background:#eaf0ff;color:#1d54d7}.wrap{max-width:1200px;margin:auto;padding:0 20px}.hero{background:linear-gradient(112deg,#e9f1ff 0%,#f5faff 60%,#d6e8fa 100%);border-bottom:1px solid #e3ebf7}.hero-inner{max-width:1200px;min-height:290px;margin:auto;padding:52px 20px;display:flex;align-items:center;justify-content:space-between;gap:30px}.hero h1{font-size:clamp(36px,5vw,58px);letter-spacing:-.05em;margin:4px 0 7px}.hero h1 span{color:var(--blue)}.hero h2{font-size:24px;margin:0 0 13px}.hero p{color:var(--sub);line-height:1.7;margin:0}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}.chip{background:#ffffffbd;border:1px solid #dde8f8;padding:8px 12px;border-radius:99px;font-size:13px}.hero-art{width:230px;height:170px;flex-shrink:0}.heading{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:30px 0 17px}.heading h2{margin:0;font-size:22px}.heading p{margin:5px 0 0;color:var(--sub);font-size:13px}.search{background:white;border:1px solid var(--border);border-radius:10px;padding:11px 13px;min-width:225px;width:270px;max-width:100%}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{display:flex;flex-direction:column;background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 5px 16px #21335308;transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #21335318}.card-top{height:96px;display:grid;place-items:center;font-size:46px;background:var(--tint)}.card-body{padding:17px;flex:1;display:flex;flex-direction:column}.card-body h3{font-size:18px;margin:0 0 7px}.card-body p{font-size:12.5px;line-height:1.6;color:var(--sub);margin:0;flex:1}.card button{border:0;background:var(--light);color:var(--accent);padding:9px 14px;border-radius:10px;font-weight:700;margin-top:17px;text-align:center}.section{padding-bottom:45px}.sim-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.sim{border:1px solid var(--border);background:white;border-radius:14px;padding:20px;display:flex;gap:14px;align-items:flex-start}.sim .symbol{font-size:28px;background:#eaf0ff;border-radius:12px;width:54px;height:54px;display:grid;place-items:center;flex-shrink:0}.sim h3{font-size:16px;margin:0 0 5px}.sim p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.5}.tag{font-size:11px;color:#14745a;background:#e1f8ef;border-radius:99px;padding:4px 9px;display:inline-block}.soon{background:#f1f3f7;color:#657184}.sim a{display:inline-block;margin-top:12px;font-size:13px;color:var(--blue);font-weight:700}.empty{grid-column:1/-1;padding:25px;color:var(--sub);background:white;border:1px dashed var(--border);border-radius:12px}footer{border-top:1px solid var(--border);padding:23px 0;color:var(--sub);font-size:12px;background:#fff}footer .wrap{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #82adfa;outline-offset:3px}@media(max-width:940px){.cards{grid-template-columns:repeat(2,1fr)}.sim-grid{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap;gap:10px}.nav{width:100%}.hero-art{width:170px}}@media(max-width:600px){.cards,.sim-grid{grid-template-columns:1fr}.hero-inner{padding:37px 20px;min-height:auto}.hero-art{display:none}.heading{align-items:stretch;flex-direction:column}.search{width:100%}.card-top{height:75px}.card{flex-direction:row}.card-top{width:95px;height:auto;flex-shrink:0;font-size:36px}.card-body{padding:13px}.card button{margin-top:10px}}
</style>
</head><body>
<header><div class="bar"><a class="brand" href="#home"><span class="logo">⚛</span><span><b>Physics Lab</b><small>互動物理實驗室</small></span></a><nav class="nav" aria-label="物理主題導覽" id="nav"></nav></div></header>
<section class="hero" id="home"><div class="hero-inner"><div><h1>Physics <span>Lab</span></h1><h2>互動物理實驗室</h2><p>用看得見、能操作的動畫，探索物理世界。<br>調整參數、觀察現象、理解原理。</p><div class="chips"><span class="chip">▶ 即時互動</span><span class="chip">⚙ 自由調整參數</span><span class="chip">◉ 課堂與自主學習</span></div></div><svg class="hero-art" viewBox="0 0 240 170" aria-hidden="true"><path d="M22 35h197M40 35l20 74m25-74l20 74m25-74l20 74m25-74l20 74" stroke="#91a9cb" stroke-width="2"/><g fill="#3677da" stroke="#d9ecff" stroke-width="3"><circle cx="60" cy="113" r="19"/><circle cx="105" cy="113" r="19"/><circle cx="150" cy="113" r="19"/><circle cx="195" cy="113" r="19"/></g><path d="M151 34l52-41" stroke="#91a9cb" stroke-width="2"/><circle cx="217" cy="-14" r="19" fill="#3677da" stroke="#d9ecff" stroke-width="3"/></svg></div></section>
<main class="wrap"><div class="heading" id="topics"><div><h2>探索物理主題</h2><p>依單元分類，快速找到適合課堂的模擬動畫</p></div></div><div class="cards" id="cards"></div><section class="section" id="simulations"><div class="heading"><div><h2 id="list-title">互動模擬動畫</h2><p>逐步增加教材，所有動畫均可使用瀏覽器操作</p></div><input class="search" type="search" id="search" placeholder="搜尋動畫，例如：駐波" aria-label="搜尋動畫"></div><div class="sim-grid" id="sim-list"></div></section></main>
<footer><div class="wrap"><span><b>Physics Lab</b>　互動物理實驗室</span><span>為物理教學與自主探索而設計 · GitHub Pages</span></div></footer>
<script>
const topics=[{id:'all',name:'全部',emoji:'⌂'},{id:'mechanics',name:'力學',emoji:'🏃',description:'運動、力、動量、能量、圓周運動',tint:'#eaf3ff',light:'#e3efff',accent:'#1f61d0'},{id:'thermal',name:'熱學',emoji:'🌡️',description:'溫度、熱量、熱傳、氣體定律',tint:'#fff0e9',light:'#ffe8e2',accent:'#b84d35'},{id:'waves',name:'波動',emoji:'🌊',description:'行進波、駐波、干涉、繞射',tint:'#e6f8f6',light:'#daf4ef',accent:'#078477'},{id:'electromagnetism',name:'電磁學',emoji:'🧲',description:'電場、磁場、電路、電磁感應',tint:'#fff5e3',light:'#fff0d1',accent:'#a66b09'},{id:'optics',name:'光學',emoji:'🌈',description:'反射、折射、透鏡、光的干涉',tint:'#f1eafb',light:'#eadefb',accent:'#7b46bf'},{id:'modern',name:'近代物理',emoji:'⚛️',description:'原子模型、量子、核物理',tint:'#e9f3ff',light:'#deecff',accent:'#275dc0'},{id:'experiments',name:'實驗與數據',emoji:'📊',description:'測量、圖表、數據分析',tint:'#e8f7e9',light:'#dff2e1',accent:'#2e8547'}];
// 動畫由 manifest 自動產生的 simulations.json 載入；新增動畫不修改首頁。
let simulations=[],catalogState='loading';
const nav=document.getElementById('nav'),cards=document.getElementById('cards'),list=document.getElementById('sim-list'),search=document.getElementById('search');let selected='all';
nav.innerHTML=topics.map(x=>`<button data-topic="${x.id}" class="${x.id==='all'?'active':''}">${x.emoji} ${x.id==='all'?'首頁':x.name}</button>`).join('');
cards.innerHTML=topics.filter(x=>x.id!=='all').map(x=>`<article class="card" style="--tint:${x.tint};--light:${x.light};--accent:${x.accent}"><div class="card-top" aria-hidden="true">${x.emoji}</div><div class="card-body"><h3>${x.name}</h3><p>${x.description}</p><button type="button" data-topic="${x.id}">探索主題 →</button></div></article>`).join('');
function render(){
  nav.querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.topic===selected);b.setAttribute('aria-pressed',String(b.dataset.topic===selected));});
  const query=search.value.trim().toLocaleLowerCase();
  const filtered=simulations.filter(x=>(selected==='all'||selected===x.category)&&(!query||(x.title+' '+x.description+' '+x.keywords.join(' ')+' '+topics.find(t=>t.id===x.category)?.name).toLocaleLowerCase().includes(query)));
  document.getElementById('list-title').textContent=(topics.find(x=>x.id===selected)?.name||'全部')+' · 互動模擬動畫';
  list.replaceChildren();
  if(catalogState!=='ready'||!filtered.length){
    const empty=document.createElement('div');empty.className='empty';empty.setAttribute('role','status');
    empty.textContent=catalogState==='loading'?'動畫目錄載入中…':catalogState==='error'?'動畫目錄無法載入，請稍後重新整理。':query?'目前沒有符合條件的動畫。可以切換其他主題或清除搜尋。':'此主題目前尚無已上架動畫，敬請期待。';
    list.append(empty);return;
  }
  filtered.forEach(x=>{
    const article=document.createElement('article');article.className='sim';
    const symbol=document.createElement('div');symbol.className='symbol';symbol.textContent=topics.find(t=>t.id===x.category)?.emoji||'▶';symbol.setAttribute('aria-hidden','true');
    const body=document.createElement('div'),h=document.createElement('h3'),p=document.createElement('p'),tag=document.createElement('span'),linkBox=document.createElement('div'),a=document.createElement('a');
    h.textContent=x.title;p.textContent=x.description;tag.className='tag';tag.textContent='可使用';a.href=x.path;a.textContent='開啟模擬器 ↗';
    linkBox.append(a);body.append(h,p,tag,linkBox);article.append(symbol,body);list.append(article);
  });
}
async function loadCatalog(){
  try{
    const response=await fetch('./simulations.json',{cache:'no-store'});
    if(!response.ok)throw Error('Catalog unavailable');
    const data=await response.json();
    if(!Array.isArray(data)||!data.every(x=>x&&typeof x.title==='string'&&typeof x.description==='string'&&topics.some(t=>t.id!=='all'&&t.id===x.category)&&Array.isArray(x.keywords)&&x.keywords.every(k=>typeof k==='string')&&typeof x.path==='string'&&new RegExp('^simulations/'+x.category+'/[a-z0-9]+(?:-[a-z0-9]+)*/$').test(x.path)))throw Error('Invalid catalog');
    simulations=data;catalogState='ready';
  }catch(error){catalogState='error';}
  render();
}
function choose(id){selected=id;render();document.getElementById('simulations').scrollIntoView({behavior:'smooth',block:'start'});}
nav.addEventListener('click',ev=>{const b=ev.target.closest('[data-topic]');if(b)choose(b.dataset.topic)});cards.addEventListener('click',ev=>{const b=ev.target.closest('[data-topic]');if(b)choose(b.dataset.topic)});search.addEventListener('input',render);render();loadCatalog();
</script></body></html>
