<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水波槽實驗室｜Physics Lab</title>
<style>
:root{font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#e8f3ff;background:#091626}*{box-sizing:border-box}body{margin:0}header{padding:12px 20px;background:#10243b;border-bottom:1px solid #26425b;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{font-size:20px}header small{color:#9ebad0}a{color:#a8daff}.shell{padding:14px;max-width:1500px;margin:auto}.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.tabs button,.actions button{border:1px solid #385473;border-radius:10px;padding:10px 14px;background:#18314b;color:#e8f3ff;white-space:nowrap;cursor:pointer;font-size:15px}.tabs button.active{background:#2568ae;border-color:#61b8ff}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px}.stage,.panel,.notes{background:#10233a;border:1px solid #25445e;border-radius:14px;padding:12px}.stage{min-width:0}.viewport{position:relative;background:#09182a;overflow:hidden;border-radius:10px}canvas{display:block;width:100%;aspect-ratio:720/440;touch-action:manipulation}.legend{display:flex;gap:16px;flex-wrap:wrap;color:#abc3d8;font-size:12px;margin:10px 3px}.panel h2,.notes h2{font-size:17px;margin:4px 0 12px}.ctrl{margin:14px 0}.ctrl label{display:flex;justify-content:space-between;gap:5px;font-size:14px}.ctrl output{color:#79caff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#63bcfa;min-height:28px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{flex:1}.select{width:100%;padding:9px;border-radius:8px;color:#e8f3ff;background:#19344e;border:1px solid #426481}.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin:12px 0}.toggle input{width:18px;height:18px}.notes{margin-top:12px;line-height:1.65;color:#c7d7e4;font-size:14px}.notes b{color:#fff}.metric{padding:10px;background:#17364d;border-radius:10px;margin-top:10px;line-height:1.6;font-size:14px}.sub{color:#a3b8c9;font-size:12px;line-height:1.6}.hide{display:none!important}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f6d16b;outline-offset:2px}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:20px}.panel h2,.actions,.metric,.sub{grid-column:1/-1}}@media(max-width:520px){.panel{display:block}header strong{font-size:17px}.shell{padding:8px}}
</style></head><body>
<header><div><strong>🌊 水波槽互動實驗室</strong><br><small>Physics Lab｜課本 1-6 水波｜P.28–45</small></div><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><a href="../ripple-wave-superposition/" style="font-weight:700;color:#ffe39b">前往新版｜波形疊加與亮暗紋 →</a><a href="../../../index.html">← 返回 Physics Lab</a></div></header>
<main class="shell"><nav class="tabs" aria-label="實驗模式"><button class="active" data-mode="reflection">① 反射</button><button data-mode="refraction">② 折射</button><button data-mode="interference">③ 干涉</button><button data-mode="diffraction">④ 繞射</button><button data-mode="huygens">⑤ 惠更斯原理</button></nav>
<div class="layout"><section class="stage"><div class="viewport"><canvas id="view" width="720" height="440" aria-label="水波動畫，藍白色表示波峰、深藍色表示波谷"></canvas></div><div class="legend"><span>◯ 淺亮色：波峰</span><span>◯ 深藍色：波谷</span><span>━ 黃色：障礙物／界面</span><span>⦿ 紅點：波源</span></div><div class="actions"><button id="play">⏸ 暫停</button><button id="step">⏭ 單步</button><button id="reset">↺ 重置</button></div><div class="metric" id="metric" aria-live="polite"></div></section>
<aside class="panel"><h2>實驗參數</h2><div class="ctrl"><label for="frequency">頻率 f <output id="frequencyValue"></output></label><input id="frequency" type="range" min="0.6" max="2.8" step="0.1" value="1.4"></div><div class="ctrl"><label for="speed">波速 v₁ <output id="speedValue"></output></label><input id="speed" type="range" min="55" max="180" step="5" value="115"></div><div class="ctrl"><label for="rate">播放速度 <output id="rateValue"></output></label><input id="rate" type="range" min="0.1" max="2" step="0.1" value="1"></div>
<div class="ctrl" id="angleRow"><label for="angle">入射角 <output id="angleValue"></output></label><input id="angle" type="range" min="0" max="65" value="30"></div>
<div class="ctrl" id="ratioRow"><label for="ratio">第二區波速比 v₂/v₁ <output id="ratioValue"></output></label><input id="ratio" type="range" min="0.45" max="1.7" step="0.05" value="0.65"></div>
<div class="ctrl" id="sepRow"><label for="sep">雙波源距離 <output id="sepValue"></output></label><input id="sep" type="range" min="25" max="260" value="150"></div>
<div class="ctrl" id="phaseRow"><label for="phase">波源相位差 <output id="phaseValue"></output></label><input id="phase" type="range" min="0" max="180" step="15" value="0"></div>
<div class="ctrl" id="gapRow"><label for="gap">狹縫／障礙寬度 <output id="gapValue"></output></label><input id="gap" type="range" min="15" max="260" value="90"></div>
<div class="ctrl" id="shapeRow"><label for="shape">繞射物體</label><select id="shape" class="select"><option value="slit">單狹縫</option><option value="double">雙狹縫</option><option value="block">中央障礙物</option></select></div>
<div class="ctrl" id="huygensRow"><label for="density">子波源數量 <output id="densityValue"></output></label><input id="density" type="range" min="5" max="21" step="2" value="11"></div>
<label class="toggle"><input type="checkbox" id="fronts" checked>顯示波前輔助線</label><label class="toggle" id="guideRow"><input type="checkbox" id="guide" checked>顯示角度／節線／子波</label>
<p class="sub">採二維理想化模型；顏色代表水面相對位移，非水深。滑桿中的長度、速度使用模擬單位；頻率與時間採一致的模擬單位。播放速度只改變動畫時鐘，不改變 v、f 或 λ。</p></aside></div>
<section class="notes"><h2 id="heading">水波反射｜P.30–31</h2><div id="explain"></div></section></main>
<script>
(()=>{'use strict';
const W=720,H=440,view=document.getElementById('view'),ctx=view.getContext('2d'),off=document.createElement('canvas');off.width=360;off.height=220;const oc=off.getContext('2d');let mode='reflection',run=true,t=0,last=0,acc=0,dirty=true;const ids=['frequency','speed','rate','angle','ratio','sep','phase','gap','density','shape','fronts','guide'],el=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const get=id=>Number(el[id].value),pi=Math.PI,tw=2*pi;
function setMode(m){mode=m;t=0;dirty=true;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));for(const [id,show] of Object.entries({angleRow:['reflection','refraction'].includes(m),ratioRow:m==='refraction',sepRow:m==='interference',phaseRow:m==='interference',gapRow:m==='diffraction',shapeRow:m==='diffraction',huygensRow:m==='huygens'}))document.getElementById(id).classList.toggle('hide',!show);
const titles={reflection:'水波反射｜P.30–31',refraction:'水波折射｜P.30–33',interference:'雙波源干涉｜P.34–39',diffraction:'水波繞射｜P.40–41',huygens:'惠更斯原理｜P.32、41'};
const prose={reflection:'<b>反射定律：</b>入射角等於反射角。黃線是反射界面，虛線是法線；調整入射角，觀察入射波及反射波的波前方向。反射前後波長、頻率及波速不變。',refraction:'<b>折射定律：</b>sin i₁/sin i₂ = v₁/v₂ = λ₁/λ₂。水波由深水區進入淺水區時波速減慢，波長縮短，斜入射時偏向法線；穿越界面時頻率不變。',interference:'<b>同調波源：</b>兩個波源頻率相同且相位差固定。對等振幅同相波源，完全建設性干涉（腹線）滿足 D=nλ，完全破壞性干涉（節線）滿足 D=(m+½)λ。可切換反相觀察圖案交換。',diffraction:'<b>繞射：</b>波通過狹縫或障礙物邊緣後，波前會彎曲；狹縫與波長相近或更小時較顯著。相同介質中，繞射不改變頻率、波速或波長。此模式以有限子波源的疊加呈現近似結果。',huygens:'<b>惠更斯原理：</b>既有波前上的每個點都可視為發出圓形子波的新波源，經過同一段時間，各子波的前向包絡形成下一道波前。可暫停後單步觀察子波擴張，並調整子波源密度。'};
document.getElementById('heading').textContent=titles[m];document.getElementById('explain').innerHTML=prose[m];refresh();}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
function refresh(){for(const id of ['frequency','speed','rate','angle','ratio','sep','phase','gap','density']){const unit={frequency:' Hz（模擬）',speed:' 單位/s',rate:' ×',angle:'°',ratio:'',sep:' 單位',phase:'°',gap:' 單位',density:' 點'}[id];document.getElementById(id+'Value').textContent=el[id].value+unit;}dirty=true;draw();}
ids.forEach(id=>el[id].addEventListener('input',refresh));document.getElementById('play').onclick=()=>{run=!run;document.getElementById('play').textContent=run?'⏸ 暫停':'▶ 播放'};document.getElementById('step').onclick=()=>{run=false;document.getElementById('play').textContent='▶ 播放';t+=1/(24*get('frequency'));draw()};document.getElementById('reset').onclick=()=>{t=0;draw()};
const pal=v=>{const q=Math.max(-1,Math.min(1,v));return [Math.max(0,Math.round(20+85*q+38*q*q)),Math.max(0,Math.round(75+110*q+38*q*q)),Math.max(0,Math.round(130+110*q))]};
function field(x,y){const f=get('frequency'),v=get('speed'),omega=tw*f,k=omega/v,a=get('angle')*pi/180;
if(mode==='reflection'){const xx=x-360,yy=y-265,sa=Math.sin(a),ca=Math.cos(a);if(y>265)return 0;return .52*Math.cos(k*(xx*sa+yy*ca)-omega*t)+.52*Math.cos(k*(xx*sa-yy*ca)-omega*t)}
if(mode==='refraction'){const xx=x-360,yy=y-225,v2=v*get('ratio'),ss=Math.sin(a)*v2/v,theta=Math.asin(Math.max(-1,Math.min(1,ss))),phase=y<225?k*(xx*Math.sin(a)+yy*Math.cos(a)):k*xx*Math.sin(a)+(omega/v2)*yy*Math.cos(theta);return Math.cos(phase-omega*t)}
if(mode==='interference'){const d=get('sep')/2,r1=Math.hypot(x-(360-d),y-295),r2=Math.hypot(x-(360+d),y-295),ph=get('phase')*pi/180;return .53*Math.cos(k*r1-omega*t)/Math.sqrt(1+r1/250)+.53*Math.cos(k*r2-omega*t+ph)/Math.sqrt(1+r2/250)}
if(mode==='diffraction'){const wall=215,g=get('gap'),s=el.shape.value;if(y<wall)return Math.cos(k*(y-wall)-omega*t);let val=0,n=0;for(let z=35;z<=685;z+=9){const dx=z-360;let open=s==='slit'?Math.abs(dx)<g/2:s==='double'?(Math.abs(dx-g*.7)<g*.18||Math.abs(dx+g*.7)<g*.18):Math.abs(dx)>g/2;if(!open)continue;const r=Math.hypot(x-z,y-wall),dy=y-wall;val+=Math.cos(k*r-omega*t+pi/4)*Math.sqrt(Math.max(.1,dy)/(r+12))/(Math.sqrt(r+15));n++}return n?Math.max(-1,Math.min(1,val*2.3/Math.sqrt(n))):0}
return 0}
function renderField(){const data=oc.createImageData(360,220),p=data.data;for(let j=0;j<220;j++)for(let i=0;i<360;i++){let v=field(i*2,j*2),rgb=pal(v);let a=(j*360+i)*4;p[a]=rgb[0];p[a+1]=rgb[1];p[a+2]=rgb[2];p[a+3]=255}oc.putImageData(data,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,W,H)}
function line(x1,y1,x2,y2,color='#ffd77b',width=2,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function point(x,y,label){ctx.fillStyle='#ff7582';ctx.beginPath();ctx.arc(x,y,6,0,tw);ctx.fill();ctx.font='bold 15px system-ui';ctx.fillStyle='#fff';ctx.fillText(label,x+9,y-9)}
function caption(str,x,y){ctx.fillStyle='#fff';ctx.font='bold 15px system-ui';ctx.fillText(str,x,y)}
function drawHuygens(){ctx.fillStyle='#091b32';ctx.fillRect(0,0,W,H);const y0=135,delta=(t*get('speed'))%110,n=get('density');line(68,y0,652,y0,'#77d5ff',3);caption('原波前',74,y0-14);const rad=Math.max(1,delta),step=550/(n-1);for(let i=0;i<n;i++){const x=85+i*step;ctx.beginPath();ctx.arc(x,y0,5,0,tw);ctx.fillStyle='#ff7582';ctx.fill();if(el.guide.checked){ctx.beginPath();ctx.arc(x,y0,rad,0,tw);ctx.strokeStyle='rgba(130,212,255,.35)';ctx.lineWidth=1.4;ctx.stroke()}}line(85,y0+rad,635,y0+rad,'#ffdb74',3);caption('新的波前（子波包絡線）',332,Math.min(422,y0+rad+25));caption('波傳播方向 ↓',280,55);const f=get('frequency'),v=get('speed');document.getElementById('metric').textContent='波長 λ = v/f = '+(v/f).toFixed(1)+' 模擬單位｜子波半徑 = '+rad.toFixed(1)+'｜新波前與原波前相距 '+rad.toFixed(1)}
function draw(){if(mode==='huygens'){drawHuygens();return}renderField();const f=get('frequency'),v=get('speed'),lambda=v/f;let note='波長 λ = v/f = '+lambda.toFixed(1)+' 模擬單位';
if(mode==='reflection'){line(0,265,W,265,'#ffe08a',6);line(360,65,360,390,'#fff',1,[8,6]);const a=get('angle')*pi/180;line(360,265,360-135*Math.sin(a),265-135*Math.cos(a),'#ffb3ab',3);line(360,265,360+135*Math.sin(a),265-135*Math.cos(a),'#81e5c5',3);note+='｜入射角 = 反射角 = '+get('angle')+'°'}
if(mode==='refraction'){line(0,225,W,225,'#ffcf6f',4);line(360,70,360,380,'#fff',1,[7,5]);const th=Math.asin(Math.max(-1,Math.min(1,Math.sin(get('angle')*pi/180)*get('ratio'))))*180/pi;caption('介質①（深／淺依波速比而定）',18,31);caption('介質②',18,265);note+='｜λ₂ = '+(lambda*get('ratio')).toFixed(1)+'｜折射角 = '+th.toFixed(1)+'°';if(get('ratio')>1&&Math.sin(get('angle')*pi/180)*get('ratio')>1)note+='（本設定超過傳播折射解的範圍：需考慮全反射）'}
if(mode==='interference'){const d=get('sep')/2;point(360-d,295,'S₁');point(360+d,295,'S₂');if(el.guide.checked){const k=tw/lambda;ctx.strokeStyle='rgba(255,218,100,.8)';ctx.lineWidth=2;for(let n=0;n<=Math.floor(get('sep')/lambda)+1;n++){ctx.beginPath();let moved=false;for(let y=12;y<430;y+=3)for(let x=12;x<710;x+=3){const r1=Math.hypot(x-(360-d),y-295),r2=Math.hypot(x-(360+d),y-295);if(Math.abs(Math.abs(r1-r2)-n*lambda)<2){ctx.fillStyle='rgba(255,220,106,.55)';ctx.fillRect(x,y,2,2)}}} }note+='｜波源距離 = '+get('sep')+'｜相位差 = '+get('phase')+'°'}
if(mode==='diffraction'){const g=get('gap'),s=el.shape.value;let blocked=z=>s==='slit'?Math.abs(z-360)>=g/2:s==='double'?!(Math.abs(z-360-g*.7)<g*.18||Math.abs(z-360+g*.7)<g*.18):Math.abs(z-360)<=g/2;for(let x=0;x<720;x+=3)if(blocked(x))line(x,215,Math.min(x+4,720),215,'#ffda81',7);note+='｜尺度/波長 = '+(g/lambda).toFixed(2)+'｜'+(g<=lambda?'繞射較顯著':'增大狹縫時前向傳播較集中')}
document.getElementById('metric').textContent=note}
function tick(ts){if(!last)last=ts;const dt=Math.min(.07,(ts-last)/1000);last=ts;if(run){t+=dt*get('rate');dirty=true}if(dirty){draw();dirty=false}requestAnimationFrame(tick)}setMode('reflection');requestAnimationFrame(tick);
})();
</script></body></html>
