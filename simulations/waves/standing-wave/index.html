<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>行進波與駐波｜Physics Lab</title>
<style>
:root{color-scheme:light;--blue:#2672dc;--green:#0b9c87;--pink:#ed486a;--amber:#d69b1b;--ink:#132341;--muted:#596981;--line:#dfe7f2;--panel:#fff;--bg:#f3f7fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px}button,input{font:inherit}button{cursor:pointer}a{color:#255ad5;text-decoration:none}.app{height:100dvh;min-height:450px;display:grid;grid-template-rows:auto minmax(0,1fr);padding:10px;gap:10px;max-width:1800px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:3px 5px}h1{font-size:clamp(17px,2.1vw,24px);margin:0}small,.muted{color:var(--muted)}.shell{min-height:0;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(285px,.78fr);gap:10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;min-height:0}.visual{display:flex;flex-direction:column;gap:8px}#plot{display:block;width:100%;flex:1;min-height:175px;touch-action:pan-y}.legend{display:flex;flex-wrap:wrap;gap:7px 16px;font-size:12px}.legend i{display:inline-block;width:15px;height:4px;border-radius:4px;vertical-align:middle;margin-right:5px}.toolbar,.toggles,.sources{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{border:1px solid var(--line);border-radius:9px;background:#f2f6ff;padding:10px 12px;font-weight:700;min-height:42px}.toolbar .primary{background:#e1ebff;border-color:#91aff3}.options{display:flex;flex-direction:column;min-height:0;overflow:auto;gap:11px;overscroll-behavior:contain}.source{flex:1;min-width:120px;border:1px solid var(--line);border-radius:11px;padding:9px;background:#f8fbff}.source strong{display:block;margin-bottom:7px}.check{display:inline-flex;gap:5px;align-items:center;margin-right:12px;min-height:30px;white-space:nowrap}.check input{width:18px;height:18px;accent-color:#2866d9}.control{display:grid;grid-template-columns:77px minmax(0,1fr) 65px;align-items:center;gap:8px;margin:9px 0}.control input{width:100%;accent-color:#285fda;min-height:30px}.control output{text-align:right;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.metric{text-align:center;background:#f0f5fc;border-radius:8px;padding:8px 3px;font-size:12px}.metric b{display:block;font-size:14px}.metric small{font-size:10px}.equation{text-align:center;font-size:15px;padding:7px;background:#f9fbff;border-radius:8px}.status{font-size:12px;line-height:1.5;background:#edf6ff;border-radius:8px;padding:9px}.subheading{font-weight:750;font-size:13px;margin-bottom:4px}.hints{font-size:11px;color:var(--muted)}@media(max-width:800px) and (orientation:portrait){.app{height:auto;min-height:100dvh}.shell{display:flex;flex-direction:column}.visual{min-height:48vh}#plot{min-height:220px}.options{overflow:visible}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-height:600px) and (orientation:landscape){.app{padding:5px;gap:5px}.panel{padding:8px}.options{gap:5px}.control{margin:1px 0}.control input{min-height:25px}.metric{padding:4px}.toolbar button{padding:5px 10px;min-height:35px}#plot{min-height:100px}.subheading{font-size:12px}.status{padding:4px}.hints{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<div class="app"><header><div><h1>〰️ 行進波與駐波｜疊加實驗室</h1><small>Physics Lab · 同一座標系 · 實際波形疊加</small></div><a href="../../../">← 返回首頁</a></header>
<div class="shell">
<section class="panel visual" aria-label="即時模擬波形"><div style="display:flex;justify-content:space-between;gap:10px"><strong>波形動態</strong><span id="clock" class="muted">t = 0.000 s</span></div>
<canvas id="plot" aria-label="向右行進波、向左行進波及合成波動態圖"></canvas>
<div class="legend"><span><i style="background:var(--blue)"></i>右行波 →</span><span><i style="background:var(--green)"></i>左行波 ←</span><span><i style="background:var(--pink)"></i>合成波</span><span><i style="background:var(--amber)"></i>波節</span></div>
<div class="toolbar"><button id="play" class="primary">⏸ 暫停</button><button id="step">單步 T/16</button><button id="reset">↺ 重設時間</button></div>
<div class="toggles"><label class="check"><input id="nodes" type="checkbox" checked>波節／波腹</label><label class="check"><input id="env" type="checkbox" checked>包絡線</label><label class="check"><input id="particles" type="checkbox" checked>介質質點</label><label class="check"><input id="crests" type="checkbox" checked>追蹤波峰</label></div>
</section>
<aside class="panel options"><div><div class="subheading">波源開關</div><div class="sources"><div class="source"><strong style="color:var(--blue)">→ 行進波 1</strong><label class="check"><input id="er" type="checkbox" checked>存在</label><label class="check"><input id="vr" type="checkbox" checked>顯示</label></div><div class="source"><strong style="color:var(--green)">← 行進波 2</strong><label class="check"><input id="el" type="checkbox" checked>存在</label><label class="check"><input id="vl" type="checkbox" checked>顯示</label></div></div></div>
<div id="status" class="status" aria-live="polite"></div><div><div class="subheading">物理參數</div>
<div class="control"><label for="n">階數 n</label><input id="n" type="range" min="1" max="6" value="3" step="1"><output id="nv">3</output></div>
<div class="control"><label for="a">振幅 A</label><input id="a" type="range" min=".2" max="2" value="1" step=".1"><output id="av">1.0 cm</output></div>
<div class="control"><label for="f">頻率 f</label><input id="f" type="range" min=".2" max="4" value="1" step=".1"><output id="fv">1.0 Hz</output></div>
<div class="control"><label for="len">弦長 L</label><input id="len" type="range" min="1" max="5" value="3" step=".5"><output id="lenv">3.0 m</output></div>
<div class="control"><label for="speed">播放速度</label><input id="speed" type="range" min=".05" max="3" value=".5" step=".05"><output id="speedv">0.50×</output></div></div>
<div class="metrics"><div class="metric"><small>波長 λ</small><b id="lambda"></b></div><div class="metric"><small>波速 v</small><b id="velocity"></b></div><div class="metric"><small>週期 T</small><b id="period"></b></div><div class="metric"><small>合成最大振幅</small><b id="maximum"></b></div></div>
<div class="equation" id="equation">y = 2A sin(kx) cos(ωt)</div><div class="hints">「存在」決定是否參與疊加；「顯示」只決定是否畫出。此為理想反向行進波疊加模型；單波情況不施加固定端反射條件。</div>
</aside></div></div>
<script>
(()=>{"use strict";const $=id=>document.getElementById(id),canvas=$("plot"),ctx=canvas.getContext("2d");let time=0,playing=true,last=null;
function state(){return {n:+$("n").value,A:+$("a").value,f:+$("f").value,L:+$("len").value,speed:+$("speed").value,er:$("er").checked,el:$("el").checked,vr:$("vr").checked,vl:$("vl").checked}}
function update(){const s=state();for(const [id,val] of Object.entries({nv:s.n,av:s.A.toFixed(1)+" cm",fv:s.f.toFixed(1)+" Hz",lenv:s.L.toFixed(1)+" m",speedv:s.speed.toFixed(2)+"×",lambda:(2*s.L/s.n).toFixed(2)+" m",velocity:(2*s.L*s.f/s.n).toFixed(2)+" m/s",period:(1/s.f).toFixed(2)+" s",maximum:(s.er&&s.el?2*s.A:s.er||s.el?s.A:0).toFixed(2)+" cm"}))$(id).textContent=val;$("vr").disabled=!s.er;$("vl").disabled=!s.el;
$("status").textContent=s.er&&s.el?"兩列行進波均存在：合成形成具有固定波節的駐波。":s.er?"只有向右行進波：合成波向右傳播，不存在固定波節。":s.el?"只有向左行進波：合成波向左傳播，不存在固定波節。":"兩列波均不存在：合成位移為零。";$("equation").textContent=s.er&&s.el?"y = 2A sin(kx) cos(ωt)":s.er?"y = A sin(kx − ωt)":s.el?"y = A sin(kx + ωt)":"y = 0";}
function draw(){const box=canvas.getBoundingClientRect(),W=Math.max(290,box.width),H=Math.max(100,box.height),dpr=Math.min(2,window.devicePixelRatio||1),pw=Math.round(W*dpr),ph=Math.round(H*dpr);if(canvas.width!==pw||canvas.height!==ph){canvas.width=pw;canvas.height=ph}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
const s=state(),x0=33,x1=W-18,w=x1-x0,cy=H/2,k=s.n*Math.PI,wt=2*Math.PI*s.f*time,unit=Math.min(58,Math.max(19,(H-55)/4)/Math.max(1,s.A));const right=u=>s.A*Math.sin(k*u-wt),left=u=>s.A*Math.sin(k*u+wt),sum=u=>(s.er?right(u):0)+(s.el?left(u):0);
ctx.strokeStyle="#dfe7f2";ctx.lineWidth=1;for(let j=-2;j<=2;j++){let y=cy+j*unit*s.A;ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x1,y);ctx.stroke()}ctx.strokeStyle="#8090a8";ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x1,cy);ctx.stroke();ctx.fillStyle="#617187";ctx.font="11px system-ui";ctx.textAlign="center";ctx.fillText("0",x0,H-5);ctx.fillText("L = "+s.L+" m",x1-25,H-5);
function curve(fn,color,width,dash=[]){ctx.beginPath();ctx.lineWidth=width;ctx.strokeStyle=color;ctx.setLineDash(dash);for(let i=0;i<=500;i++){const u=i/500,x=x0+w*u,y=cy-unit*fn(u);if(!i)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([])}
if(s.er&&s.el&&$("env").checked){curve(u=>2*s.A*Math.abs(Math.sin(k*u)),"#df8da0",1.3,[5,5]);curve(u=>-2*s.A*Math.abs(Math.sin(k*u)),"#df8da0",1.3,[5,5])}
if(s.er&&s.vr)curve(right,"#2672dc",2,[8,5]);if(s.el&&s.vl)curve(left,"#0b9c87",2,[8,5]);curve(sum,"#ed486a",3);
if($("particles").checked)for(let i=0;i<=35;i++){let u=i/35;ctx.beginPath();ctx.arc(x0+w*u,cy-unit*sum(u),2.5,0,2*Math.PI);ctx.fillStyle="#ed486a";ctx.fill()}
if(s.er&&s.el&&$("nodes").checked){for(let j=0;j<=s.n;j++){let x=x0+w*j/s.n;ctx.beginPath();ctx.arc(x,cy,4.2,0,2*Math.PI);ctx.fillStyle="#d69b1b";ctx.fill();ctx.fillStyle="#68748b";ctx.fillText("N",x,cy+17)}for(let j=0;j<s.n;j++){let x=x0+w*(j+.5)/s.n;ctx.beginPath();ctx.arc(x,cy,3,0,2*Math.PI);ctx.fillStyle="#9b65bb";ctx.fill()}}
if($("crests").checked){function crest(phase,sign,color){for(let j=-30;j<=30;j++){let u=(Math.PI/2+2*Math.PI*j+phase)/k;if(u>.035&&u<.965){let x=x0+w*u,y=cy-unit*s.A;ctx.beginPath();ctx.arc(x,y,4,0,2*Math.PI);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x+sign*5,y-9);ctx.lineTo(x+sign*20,y-9);ctx.lineTo(x+sign*16,y-12);ctx.moveTo(x+sign*20,y-9);ctx.lineTo(x+sign*16,y-6);ctx.stroke()}}}if(s.er&&s.vr)crest(wt,1,"#2672dc");if(s.el&&s.vl)crest(-wt,-1,"#0b9c87")}
$("clock").textContent="t = "+time.toFixed(3)+" s";}
document.querySelectorAll("input").forEach(x=>x.addEventListener("input",()=>{update();draw()}));$("play").onclick=()=>{playing=!playing;$("play").textContent=playing?"⏸ 暫停":"▶ 播放"};$("step").onclick=()=>{playing=false;$("play").textContent="▶ 播放";time+=1/state().f/16;draw()};$("reset").onclick=()=>{time=0;draw()};
function tick(now){if(!document.body.isConnected)return;if(last!==null&&playing)time+=Math.min((now-last)/1000,.06)*state().speed;last=now;draw();requestAnimationFrame(tick)}update();requestAnimationFrame(tick);if("ResizeObserver"in window)new ResizeObserver(draw).observe(canvas);
})();
</script></body></html>
